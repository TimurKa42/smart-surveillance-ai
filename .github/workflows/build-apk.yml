name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git unzip openjdk-17-jdk \
            python3-pip python3-dev \
            libffi-dev libssl-dev \
            zlib1g-dev libncurses5-dev libtinfo5 \
            autoconf automake libtool pkg-config \
            zip liblzma-dev libbz2-dev libsqlite3-dev \
            cmake ninja-build
      - name: Install Buildozer and Cython
        run: pip install --upgrade buildozer cython==0.29.36 meson meson-python ninja
      - name: Set JAVA_HOME to 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
      - name: Cache buildozer packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/packages
            mobile/.buildozer/android/platform/build-*/packages
          key: buildozer-packages-${{ hashFiles('mobile/buildozer.spec') }}
          restore-keys: |
            buildozer-packages-
      # download.savannah.gnu.org периодически отдаёт 502 на freetype-2.10.1.tar.gz.
      # Кладём файл заранее ИМЕННО туда, где его ищет python-for-android:
      # $GITHUB_WORKSPACE/mobile/.buildozer/android/platform/build-arm64-v8a/packages/freetype/
      # (не ~/.buildozer/... — там p4a пакеты не ищет).
      - name: Pre-download freetype (works around savannah 502s)
        run: |
          set -e
          URL="https://download.savannah.gnu.org/releases/freetype/freetype-2.10.1.tar.gz"
          DEST_DIR="$GITHUB_WORKSPACE/mobile/.buildozer/android/platform/build-arm64-v8a/packages/freetype"
          DEST_FILE="$DEST_DIR/freetype-2.10.1.tar.gz"
          mkdir -p "$DEST_DIR"
          if [ -s "$DEST_FILE" ]; then
            echo "freetype already present (from cache), skipping download."
            exit 0
          fi
          for i in $(seq 1 10); do
            echo "Attempt $i: downloading freetype..."
            if curl -fL --retry 3 --retry-delay 5 -o "$DEST_FILE" "$URL"; then
              echo "Downloaded successfully."
              break
            fi
            echo "Failed (likely 502), waiting before retry..."
            rm -f "$DEST_FILE"
            sleep 20
          done
          if [ ! -s "$DEST_FILE" ]; then
            echo "Could not download freetype after multiple attempts, continuing anyway (buildozer will try itself)."
          fi
      - name: Build APK
        env:
          PIP_NO_BINARY: fonttools
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 5
          retry_wait_seconds: 90
          command: cd mobile && yes | buildozer -v android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-surveillance-apk
          path: mobile/bin/*.apk
